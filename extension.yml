schema_version: "1.0"

extension:
  id: "schedule"
  name: "Spec Kit Schedule — parallel subagent rounds"
  version: "0.7.2"
  description: "Zero-config planner that turns tasks.md into optimal parallel rounds for subagents (CP-SAT, critical-path aware, file-conflict safe) and an implement command that runs them round by round with tasks.md checkboxes as the single source of progress."
  author: "Julio César Franco Ardila"
  repository: "https://github.com/jfranc38/spec-kit-schedule"
  license: "MIT"
  homepage: "https://github.com/jfranc38/spec-kit-schedule"

# Python dependencies live in pyproject.toml / uv.lock and are installed
# into a private environment under the extension directory the first time
# a command runs (bin/speckit-schedule). `specify` itself installs nothing.
requires:
  speckit_version: ">=0.4.0"
  tools:
    - name: "python3"
      version: ">=3.10,<3.13"
      required: true

provides:
  commands:
    # Command ids follow ^speckit\.<extension id>\.<verb>$. spec-kit registers
    # them as skills invoked with hyphens (e.g. /speckit-schedule-run).
    - name: "speckit.schedule.run"
      file: "commands/schedule.md"
      description: "Plan tasks.md into parallel subagent rounds → schedule.md + schedule.json (zero config)"
      aliases:
        - "speckit.schedule.plan"
        - "speckit.schedule.solve"
    - name: "speckit.schedule.implement"
      file: "commands/implement.md"
      description: "Run the planned rounds with parallel subagents; progress tracked in tasks.md checkboxes; resumable"
    - name: "speckit.schedule.status"
      file: "commands/status.md"
      description: "Self-diagnose the installation (files, hook, solver env, optional config, run history)"
  # Scaffolded by `specify extension add` to
  # .specify/extensions/schedule/schedule-config.yml (preserved on update).
  # Two knobs, both optional; the file is equivalent to zero-config as shipped.
  config:
    - name: "schedule-config.yml"
      template: "config-template.yml"
      description: "workers / max_tasks_per_worker (advanced agents: portfolio commented out)"

# Optional hooks: the core command surfaces the prompt and the user decides.
hooks:
  after_tasks:
    command: speckit.schedule.run
    optional: true
    prompt: "Plan these tasks into parallel subagent rounds?"
    description: "Suggest planning right after task generation"
  after_converge:
    command: speckit.schedule.run
    optional: true
    prompt: "tasks.md changed — re-plan the parallel rounds?"
    description: "Suggest re-planning after converge appends tasks"

tags:
  - "scheduling"
  - "optimization"
  - "multi-agent"
  - "subagents"
  - "parallel-execution"
