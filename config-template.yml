# =============================================================================
# spec-kit-schedule — optional configuration
# =============================================================================
# This file is NOT required. Without it the planner uses three identical
# subagent lanes ("workers") and sensible solver defaults.
#
# `specify extension add` scaffolds this file to
#   .specify/extensions/schedule/schedule-config.yml   (kept across updates)
# Edit it there, or copy it to .specify/schedule/schedule-config.yml (which
# takes precedence). Both knobs are also flags:
#   /speckit-schedule-run --workers 4 --max-tasks-per-worker 6
# =============================================================================

workers: 3              # parallel subagent lanes
max_tasks_per_worker: 0 # 0 = no cap; e.g. 6 keeps every subagent's context short
                        # (lanes are added automatically if the cap is too small)

# -----------------------------------------------------------------------------
# Advanced: heterogeneous agent portfolio (uncomment to use)
# -----------------------------------------------------------------------------
# Declaring `agents:` switches to the full model: each agent has a skill
# set, a cardinality cap (kappa), a context budget (kilotokens), a relative
# speed and an optional price; tasks are routed by `skill_rules` (longest
# path-fragment match) and estimated by verb via `token_estimates`. See
# docs/example-config.yml for a complete, runnable example and
# docs/formulation.md for the model. When `agents:` is present the
# `workers` knobs above are ignored.
#
# agents:
#   - id: builder
#     provider: anthropic            # informational; passed through to schedule.md
#     model: claude-sonnet-4-6       # informational
#     skills: ["*"]                  # "*" = any task; or e.g. [python, backend, api]
#     kappa: 10                      # max tasks per session
#     context_budget: 32             # kilotokens per session
#     speed_factor: 1.0              # 2.0 = twice as fast
#     price_per_1k_tokens: 0.003     # only used by objective: cost_aware
#   - id: tester
#     model: claude-haiku-4-5
#     skills: [test]
#     kappa: 15
#     context_budget: 16
#     speed_factor: 1.5
#
# skill_rules:                       # path fragment → skill (longest match wins)
#   - { pattern: "tests/", skill: test }
#   - { pattern: "src/api/", skill: api }
# default_skill: backend
#
# token_estimates:                   # per action-verb bucket (see complexity_verbs)
#   simple: 1500
#   medium: { mean: 3500, std_dev: 500 }
#   complex: 6000
#   review: 2000
#
# solver:
#   objective: lexicographic         # lexicographic | weighted | cost_aware
#   time_limit: 60                   # seconds per phase
#   num_workers: 8                   # CP-SAT threads
#   anytime: false                   # true = return best-so-far at the limit
